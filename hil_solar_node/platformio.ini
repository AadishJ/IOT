[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
